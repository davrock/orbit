# 🚀 ORBIT Missions - Development Workflows

missions:
  # Core Missions
  launch:
    description: "Full feature development"
    phases: [plan, implement, test, review, commit]
    aliases: [feature, ship]
    
  repair:
    description: "Bug fix workflow"
    phases: [debug, implement, test, commit]
    aliases: [fix, bug]
    
  warp:
    description: "Minimal quick change"
    phases: [implement, commit]
    aliases: [quick, fast]
    
  mayday:
    description: "Emergency hotfix"
    phases: [debug, implement, commit]
    aliases: [hotfix, emergency]
    
  preflight:
    description: "Test-driven development"
    phases: [test, implement, test, review, commit]
    aliases: [tdd]

  # Security & Quality
  shields-up:
    description: "Security-focused development"
    phases: [plan, implement, security, test, review, commit]
    aliases: [secure, armor]
    
  paranoid:
    description: "Extra thorough review"
    phases: [implement, review, test, review, commit]
    aliases: [careful]

  # Specialized
  dock:
    description: "API development"
    phases: [plan, implement, test, document, commit]
    aliases: [api, endpoint]
    
  transmit:
    description: "Documentation only"
    phases: [implement, review, commit]
    aliases: [docs, readme]
    
  explore:
    description: "Research and document"
    phases: [research, document]
    aliases: [research, investigate]

  # Full Missions
  apollo:
    description: "Complete mission - all phases"
    phases: [research, plan, implement, test, security, review, document, commit]
    aliases: [everything, complete]
    
  production:
    description: "Production-ready deployment"
    phases: [plan, implement, test, security, review, test, commit, deploy]
    aliases: [prod, release]

  # Advanced Modes
  pipeline:
    description: "Sequential multi-stage processing with handoffs"
    phases: [plan, implement, test, review, commit]
    aliases: [sequential, stages]
