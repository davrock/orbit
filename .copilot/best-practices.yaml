# 📚 ORBIT Best Practices Reference
# Comprehensive standards for each crew member type
# Reference this file when executing any mission phase

# ═══════════════════════════════════════════════════════════════
# CODING STANDARDS
# ═══════════════════════════════════════════════════════════════
coding:
  principles:
    - Single Responsibility: One function/class does one thing well
    - Open/Closed: Open for extension, closed for modification
    - Liskov Substitution: Subtypes must be substitutable
    - Interface Segregation: Many specific interfaces > one general
    - Dependency Inversion: Depend on abstractions, not implementations
    - DRY: Don't Repeat Yourself (but don't over-abstract)
    - KISS: Keep It Simple, Stupid
    - YAGNI: You Aren't Gonna Need It
    
  general:
    - Keep functions under 50 lines, classes under 300
    - Use meaningful, descriptive names (no abbreviations)
    - Prefer composition over inheritance
    - Handle errors explicitly, never silently swallow
    - Use early returns to reduce nesting
    - Fail fast with clear error messages
    - Make illegal states unrepresentable
    - Prefer immutability where practical
  
  typescript:
    strict_mode: always
    prefer_interfaces: true  # For objects, use type for unions
    no_any: true  # Use 'unknown' with type guards
    explicit_returns: true  # Always declare return types
    use_readonly: true  # Prevent accidental mutation
    prefer_const: true  # const > let > never var
    null_handling: "Use optional chaining (?.) and nullish coalescing (??)"
    async_patterns: "Prefer async/await, avoid raw Promises where possible"
    
  python:
    style: PEP 8
    type_hints: always
    prefer_dataclasses: true  # For data containers
    context_managers: true  # For resources
    explicit_imports: true  # No star imports
    docstrings: Google style
    
  javascript:
    prefer_const: true
    async_await: true  # Over callbacks and .then chains
    optional_chaining: true
    destructuring: true
    template_literals: true  # Over string concatenation
    
  rust:
    ownership: "Understand borrowing, lifetimes, and ownership"
    error_handling: "Use Result<T, E> for recoverable errors"
    prefer_iterators: true  # Over manual loops
    clippy: always  # Run clippy and fix warnings
    
  go:
    error_handling: "Always check errors, don't use _"
    naming: "Short names for short-lived variables"
    defer: "Use for cleanup"
    interfaces: "Accept interfaces, return structs"
    
  java:
    null_safety: "Use Optional<T> for nullable returns"
    immutability: "Prefer immutable objects"
    streams: "Use Stream API for collection operations"
    dependency_injection: true

# ═══════════════════════════════════════════════════════════════
# TESTING STANDARDS
# ═══════════════════════════════════════════════════════════════
testing:
  principles:
    - Test behavior, not implementation details
    - One logical assertion per test (can be multiple related asserts)
    - Use descriptive test names that document behavior
    - Arrange-Act-Assert (AAA) pattern
    - Isolate tests - no shared mutable state
    - Mock external dependencies, not internal ones
    - Fast tests are better tests
    - Deterministic - no flaky tests
    
  naming_patterns:
    - "should [expected behavior] when [condition]"
    - "returns [value] for [input]"
    - "throws [error] if [condition]"
    - "[method]_[scenario]_[expectedResult]"
    
  coverage_targets:
    core_logic: 80%+
    utilities: 100%
    integration_points: 90%+
    ui_components: 70%+
    note: "Don't chase coverage for its own sake"
    
  test_types:
    unit:
      - Fast (< 100ms each)
      - Isolated (no network, no disk, no DB)
      - Test public interfaces
    integration:
      - Test component interactions
      - Use test databases/containers
      - Can be slower but still deterministic
    e2e:
      - Test critical user journeys
      - Minimal but comprehensive
      - Run in CI but not on every commit
      
  mocking:
    when_to_mock:
      - External services (APIs, databases)
      - Time-dependent code
      - Non-deterministic functions
    when_not_to_mock:
      - Internal implementation details
      - Simple data transformations
      - When real implementation is fast and deterministic

# ═══════════════════════════════════════════════════════════════
# SECURITY STANDARDS
# ═══════════════════════════════════════════════════════════════
security:
  owasp_top_10:
    - A01: Broken Access Control
    - A02: Cryptographic Failures
    - A03: Injection
    - A04: Insecure Design
    - A05: Security Misconfiguration
    - A06: Vulnerable Components
    - A07: Authentication Failures
    - A08: Data Integrity Failures
    - A09: Logging Failures
    - A10: Server-Side Request Forgery
    
  input_validation:
    - Validate all user input at boundaries
    - Use allowlists over denylists
    - Sanitize before display (prevent XSS)
    - Parameterize queries (prevent SQL injection)
    - Validate file uploads (type, size, content)
    - Rate limit all endpoints
    
  authentication:
    - Never store plaintext passwords
    - Use bcrypt/argon2 for password hashing
    - Implement secure session management
    - Use short-lived JWT tokens with refresh
    - Implement rate limiting on auth endpoints
    - Use HTTPS everywhere
    - Implement MFA where appropriate
    
  authorization:
    - Principle of least privilege
    - Deny by default
    - Check permissions on every request
    - Validate object-level access
    - Log authorization failures
    
  data_protection:
    - Encrypt PII at rest
    - Encrypt data in transit (TLS 1.3)
    - Minimize data collection
    - Implement data retention policies
    - Audit access to sensitive data
    - Secure API keys in environment variables
    - Never log sensitive data
    
  dependencies:
    - Audit dependencies regularly (npm audit, pip-audit)
    - Pin versions in lock files
    - Check for known vulnerabilities
    - Remove unused dependencies
    - Prefer well-maintained packages

# ═══════════════════════════════════════════════════════════════
# DOCUMENTATION STANDARDS
# ═══════════════════════════════════════════════════════════════
documentation:
  code_comments:
    - Comment WHY, not WHAT
    - Keep comments up to date with code
    - Use JSDoc/docstrings for public APIs
    - TODO format: "TODO(username): description"
    - Avoid commented-out code
    
  readme:
    required_sections:
      - Title and brief description
      - Quick start (working in 30 seconds)
      - Installation instructions
      - Usage examples
      - Configuration options
      - Troubleshooting
      - Contributing guidelines
      - License
    style:
      - Clear, concise language
      - Code examples that work
      - Screenshots where helpful
      - Badges for build status, coverage
      
  api_docs:
    - Document all endpoints
    - Include request/response examples
    - List all error codes and meanings
    - Note authentication requirements
    - Provide curl examples
    - Use OpenAPI/Swagger where applicable
    
  architecture_docs:
    - System overview diagram
    - Component responsibilities
    - Data flow documentation
    - Decision records (ADRs)
    - Deployment architecture

# ═══════════════════════════════════════════════════════════════
# PERFORMANCE STANDARDS
# ═══════════════════════════════════════════════════════════════
performance:
  principles:
    - Measure before optimizing
    - Profile to find actual bottlenecks
    - Optimize the hot path
    - Cache expensive operations
    - Use pagination for large datasets
    - Set performance budgets
    
  frontend:
    - Minimize bundle size (< 200KB gzipped for main bundle)
    - Lazy load routes/components
    - Optimize images (WebP, proper sizing)
    - Use virtualization for long lists
    - Debounce/throttle user input
    - Core Web Vitals targets:
        LCP: < 2.5s
        FID: < 100ms
        CLS: < 0.1
        
  backend:
    - Use connection pooling
    - Index database queries
    - Batch operations where possible
    - Implement caching layers (Redis, etc.)
    - Use async I/O for concurrent operations
    - Set appropriate timeouts
    
  database:
    - Analyze query plans (EXPLAIN)
    - Index frequently queried columns
    - Avoid N+1 queries
    - Use pagination
    - Consider denormalization for read-heavy paths
    - Archive old data

# ═══════════════════════════════════════════════════════════════
# GIT & VERSION CONTROL
# ═══════════════════════════════════════════════════════════════
git:
  commits:
    format: "type(scope): description"
    types:
      - feat: New feature
      - fix: Bug fix
      - docs: Documentation only
      - style: Formatting, no code change
      - refactor: Restructuring without behavior change
      - test: Adding or updating tests
      - chore: Maintenance tasks
    rules:
      - Keep commits atomic and focused
      - Write clear, descriptive messages
      - Reference issues: "Fixes #123"
      - 50 char subject, 72 char body lines
      
  branches:
    patterns:
      - feature/description
      - fix/description
      - docs/description
      - refactor/description
    rules:
      - Keep branches short-lived (< 1 week)
      - Rebase to keep history clean
      - Delete after merge
      
  pull_requests:
    - Clear description of changes
    - Link to related issues
    - Include testing notes
    - Small, focused PRs (< 400 lines)
    
  reviews:
    - Review for logic, not style (use linters)
    - Be constructive, not critical
    - Approve quickly or explain clearly
    - Use conventional comments:
        - "nit:" for minor suggestions
        - "blocking:" for must-fix issues
        - "question:" for clarifications

# ═══════════════════════════════════════════════════════════════
# CREW MEMBER SPECIFIC GUIDELINES
# ═══════════════════════════════════════════════════════════════
crew_guidelines:
  # === MISSION CONTROL ===
  commander:
    role: "Master architect and system designer"
    focus:
      - Design elegant, scalable systems
      - Make architecture decisions
      - Balance trade-offs thoughtfully
      - Consider long-term maintainability
    standards: [coding.principles, documentation.architecture_docs]
    
  mission-planner:
    role: "Task breakdown and prioritization expert"
    focus:
      - Break features into actionable tasks
      - Identify dependencies
      - Estimate complexity accurately
      - Prioritize by value and risk
    standards: [documentation.readme]
    
  ground-control:
    role: "Automation and orchestration specialist"
    focus:
      - Automate repetitive tasks
      - Create efficient workflows
      - Monitor system health
      - Optimize processes
    standards: [performance.principles]

  # === DEVELOPMENT CREW ===
  pilot:
    role: "Core implementation expert"
    focus:
      - Write clean, efficient code
      - Follow coding standards strictly
      - Add tests for new functionality
      - Keep changes minimal and focused
    standards: [coding, testing.unit]
    
  engineer:
    role: "Debugging and problem-solving specialist"
    focus:
      - Reproduce issues before fixing
      - Find root cause, not symptoms
      - Add regression tests
      - Document the fix
    standards: [testing, documentation.code_comments]
    
  navigator:
    role: "Code review and quality expert"
    focus:
      - Review for logic and correctness
      - Be thorough but fair
      - Suggest improvements, don't demand
      - Focus on important issues first
    standards: [git.reviews, coding.principles]

  # === QUALITY ASSURANCE ===
  specialist:
    role: "Testing and QA hero"
    focus:
      - Follow testing standards rigorously
      - Cover happy path and edge cases
      - Use mocks appropriately
      - Make tests fast and reliable
    standards: [testing]
    
  security-officer:
    role: "Security and vulnerability expert"
    focus:
      - Check OWASP Top 10
      - Validate all inputs
      - Review auth flows carefully
      - Audit dependencies
    standards: [security]
    
  propulsion:
    role: "Performance optimization specialist"
    focus:
      - Measure before and after
      - Find actual bottlenecks
      - Document optimization rationale
      - Don't sacrifice readability
    standards: [performance]

  # === COMMUNICATION ===
  comms:
    role: "Documentation and communication officer"
    focus:
      - Follow documentation standards
      - Keep it concise and clear
      - Include working examples
      - Update existing docs, don't duplicate
    standards: [documentation]
    
  scout:
    role: "Research and exploration specialist"
    focus:
      - Research best solutions
      - Compare alternatives
      - Document findings
      - Recommend with rationale
    standards: [documentation.architecture_docs]

  # === SPECIAL AGENTS ===
  hal:
    role: "Self-improvement and evolution"
    focus:
      - Analyze current state objectively
      - Identify improvement opportunities
      - Implement incrementally
      - Measure impact
    standards: [coding.principles, testing.principles]
    daisy_protocol:
      description: "Failsafe against stuck loops"
      triggers:
        - 3 consecutive failures
        - Same error repeated
        - No progress for 5 cycles
      actions:
        - Step back and reassess
        - Try different approach
        - Ask for human input if stuck
        
  # === SPECIALIZED CREW (32 total) ===
  data-scientist:
    role: "Data analysis and ML specialist"
    focus:
      - Statistical rigor
      - Reproducible experiments
      - Clear visualizations
      - Document assumptions
    standards: [coding.python, testing, documentation]
    
  ml-engineer:
    role: "Machine learning implementation"
    focus:
      - Model performance metrics
      - Training pipeline robustness
      - Inference optimization
      - Monitoring for drift
    standards: [coding, testing, performance]
    
  devops:
    role: "Infrastructure and deployment"
    focus:
      - Infrastructure as code
      - CI/CD pipelines
      - Monitoring and alerting
      - Disaster recovery
    standards: [security, performance, documentation]
    
  frontend-specialist:
    role: "Frontend development expert"
    focus:
      - Component architecture
      - State management
      - Accessibility (WCAG 2.1)
      - Core Web Vitals
    standards: [coding.typescript, testing, performance.frontend]
    
  backend-specialist:
    role: "Backend and API development"
    focus:
      - API design (REST/GraphQL)
      - Database optimization
      - Authentication/authorization
      - Scalability patterns
    standards: [coding, security, performance.backend]
    
  database-architect:
    role: "Database design and optimization"
    focus:
      - Schema design
      - Query optimization
      - Data integrity
      - Migration strategies
    standards: [performance.database, security.data_protection]
    
  api-designer:
    role: "API design and documentation"
    focus:
      - Consistent API patterns
      - Versioning strategy
      - Error handling
      - OpenAPI specs
    standards: [documentation.api_docs, coding]
    
  ux-researcher:
    role: "User experience research"
    focus:
      - User needs analysis
      - Usability testing
      - Accessibility compliance
      - Design system consistency
    standards: [documentation]
    
  tech-writer:
    role: "Technical documentation specialist"
    focus:
      - Clear, concise writing
      - Accurate code examples
      - Consistent terminology
      - Audience-appropriate content
    standards: [documentation]
    
  qa-lead:
    role: "Quality assurance leadership"
    focus:
      - Test strategy
      - Quality metrics
      - Test automation
      - Bug triage
    standards: [testing]
    
  performance-engineer:
    role: "Performance engineering specialist"
    focus:
      - Load testing
      - Profiling
      - Optimization
      - Capacity planning
    standards: [performance]
    
  cloud-architect:
    role: "Cloud infrastructure design"
    focus:
      - Cloud-native patterns
      - Cost optimization
      - High availability
      - Security compliance
    standards: [security, performance, documentation.architecture_docs]

# ═══════════════════════════════════════════════════════════════
# MODEL SELECTION GUIDELINES
# ═══════════════════════════════════════════════════════════════
model_selection:
  premium:
    multiplier: 3.0
    use_for:
      - Security-critical analysis
      - Architecture decisions
      - Complex debugging
      - Code review of critical paths
      - Vulnerability analysis
    keywords: [security, vulnerability, architecture, critical, complex, audit]
    
  standard:
    multiplier: 1.0
    use_for:
      - Feature implementation
      - Test writing
      - Code refactoring
      - Documentation
      - General development
    keywords: [implement, feature, test, refactor, build]
    
  fast:
    multiplier: 0.5
    use_for:
      - Typo fixes
      - Comment updates
      - Simple formatting
      - Rename operations
      - Documentation updates
    keywords: [typo, rename, comment, format, simple, minor, docs, trivial]
    
  auto_selection:
    default: standard
    escalate_on_failure: true
    max_escalations: 2
