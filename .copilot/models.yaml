# 🧠 ORBIT LLM Model Selection Configuration
# Optimize cost & quality by matching models to tasks
# Reference: https://docs.anthropic.com/models (pricing)

models:
  # Premium models (3x tokens) - complex reasoning, architecture, security
  premium:
    providers:
      anthropic: claude-sonnet-4-20250514
      openai: gpt-4o
      google: gemini-1.5-pro
    best_for:
      - Complex architecture decisions
      - Security vulnerability analysis
      - Multi-file refactoring
      - Performance optimization
      - Critical bug debugging
  
  # Standard models (1x tokens) - general development
  standard:
    providers:
      anthropic: claude-3.5-haiku
      openai: gpt-4o-mini
      google: gemini-flash
    best_for:
      - Feature implementation
      - Test writing
      - Code review
      - Documentation
      - General debugging
      
  # Fast/cheap models (0.5x tokens) - simple tasks
  fast:
    providers:
      anthropic: claude-3.5-haiku
      openai: gpt-4o-mini
      google: gemini-flash
    best_for:
      - Typo fixes
      - Comment updates
      - Simple formatting
      - Commit messages
      - README updates

# Task-to-model mapping
task_routing:
  # Complex reasoning → Premium
  architecture_design: premium
  security_audit: premium
  vulnerability_analysis: premium
  complex_debugging: premium
  code_review_critical: premium
  performance_optimization: premium
  database_migration: premium
  api_redesign: premium
  
  # General development → Standard
  implement_feature: standard
  write_tests: standard
  code_review: standard
  documentation: standard
  refactoring: standard
  bug_fix: standard
  api_development: standard
  component_creation: standard
  
  # Simple/routine → Fast
  formatting: fast
  simple_fix: fast
  rename: fast
  comment_code: fast
  linting: fast
  commit_message: fast
  simple_docs: fast
  typo_fix: fast
  readme_update: fast

# Phase-to-tier mapping
phase_tiers:
  plan: standard        # Planning is pattern-based
  implement: standard   # Most implementation is standard
  test: standard        # Test writing is pattern-based
  review: standard      # Code review - standard unless critical
  debug: standard       # Start standard, escalate if stuck
  security: premium     # Security needs thorough analysis
  document: fast        # Docs are straightforward
  commit: fast          # Commit messages are simple
  research: standard    # Research can be standard

# Crew member model preferences
crew_tiers:
  # Premium tier crew (specialist domains)
  commander: premium           # Architecture decisions
  security-officer: premium    # Security analysis
  database-architect: premium  # Schema design
  cloud-architect: premium     # Infrastructure design
  
  # Standard tier crew (general development)
  pilot: standard              # Core implementation
  engineer: standard           # Debugging
  navigator: standard          # Code review
  specialist: standard         # Testing
  mission-planner: standard    # Task breakdown
  scout: standard              # Research
  ground-control: standard     # Automation
  hal: standard                # Self-improvement
  data-scientist: standard     # Data analysis
  ml-engineer: standard        # ML implementation
  devops: standard             # CI/CD
  frontend-specialist: standard
  backend-specialist: standard
  api-designer: standard
  qa-lead: standard
  performance-engineer: standard
  propulsion: standard         # Performance optimization
  
  # Fast tier crew (documentation focus)
  comms: fast                  # Documentation
  tech-writer: fast            # Technical writing
  ux-researcher: fast          # UX documentation

# Keyword detection for auto-selection
keywords:
  premium:
    - security
    - vulnerability
    - exploit
    - breach
    - architecture
    - redesign
    - migration
    - critical
    - production
    - audit
    - penetration
    - compliance
    - gdpr
    - pii
    - encryption
    
  fast:
    - typo
    - rename
    - comment
    - format
    - simple
    - minor
    - docs
    - trivial
    - readme
    - spelling
    - whitespace
    - changelog
    - license

# Cost tracking multipliers
cost_multipliers:
  premium: 3.0
  standard: 1.0
  fast: 0.5

# Escalation rules
escalation:
  max_retries_before_escalate: 2
  escalation_path:
    fast: standard
    standard: premium
    premium: premium  # No escalation, retry with different approach
  max_premium_retries: 2

# Scope-based adjustments
scope_adjustments:
  # Number of files changed
  large_scope:
    threshold: 10  # More than 10 files
    adjustment: "+1"  # Bump up one tier
  small_scope:
    threshold: 2   # 2 or fewer files
    adjustment: "-1"  # Can use cheaper tier
    
# Usage recommendations
recommendations:
  save_tokens:
    - "Use --economy flag for simple tasks"
    - "Batch similar small changes together"
    - "Use fast tier for docs and formatting"
  quality_focus:
    - "Use --premium flag for security work"
    - "Always use premium for production bugs"
    - "Premium for any architectural changes"
