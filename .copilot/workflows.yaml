# 🚀 Workflow Recipes - Development Patterns

workflows:
  # === THE CLASSICS ===
  ship-it:
    description: "Full feature delivery"
    phases: [plan, implement, test, review, commit]
    
  squash:
    description: "Bug extermination"
    phases: [debug, implement, test, commit]
    
  polish:
    description: "Code refinement"
    phases: [implement, test, review, commit]

  # === SPEED RUNS ===
  yolo:
    description: "Ship fast, pray harder"
    phases: [implement, commit]
    
  hotdog:
    description: "Emergency hotfix"
    phases: [debug, implement, commit]
    
  quickie:
    description: "Small change, quick commit"
    phases: [implement, test, commit]

  # === QUALITY BUILDS ===
  test-first:
    description: "TDD like a pro"
    phases: [test, implement, test, review, commit]
    
  fort-knox:
    description: "Security-hardened delivery"
    phases: [plan, implement, security, test, review, commit]
    agents:
      security: cipher
      review: [cipher, linus]
    
  paranoid:
    description: "Double review everything"
    phases: [implement, review, test, review, commit]

  # === SPECIALIST TRACKS ===
  wordsmith:
    description: "Documentation updates"
    phases: [implement, review, commit]
    agents:
      implement: scribe
      review: scribe
    
  endpoint:
    description: "API development"
    phases: [plan, implement, test, document, commit]
    agents:
      plan: [api-guru, jarvis]
      implement: api-guru
      document: scribe
    
  data-work:
    description: "Database changes"
    phases: [plan, implement, test, commit]
    agents:
      plan: data-sage
      implement: data-sage
    
  pretty:
    description: "Frontend work"
    phases: [plan, implement, test, commit]
    agents:
      implement: pixel
    
  backbone:
    description: "Backend development"
    phases: [plan, implement, test, commit]
    agents:
      implement: backend-bob
    
  pocket:
    description: "Mobile development"
    phases: [plan, implement, test, commit]
    agents:
      implement: mobile-max

  # === ANALYSIS ===
  inspect:
    description: "Code review only"
    phases: [review]
    
  penetrate:
    description: "Security audit"
    phases: [security, review]
    agents:
      security: cipher
      review: cipher
    
  turbo:
    description: "Performance tuning"
    phases: [analyze, implement, test, commit]
    agents:
      analyze: flash
      implement: flash

  # === DEVOPS ===
  launch:
    description: "Deploy to production"
    phases: [test, deploy, commit]
    agents:
      deploy: devops-dan
    
  pipeline:
    description: "CI/CD setup"
    phases: [implement, test, deploy, commit]
    agents:
      implement: devops-dan
      deploy: devops-dan

  # === META ===
  explore:
    description: "Research & document"
    phases: [research, document]
    agents:
      research: scout
      document: scribe
    
  think:
    description: "Planning only"
    phases: [plan]
    
  evolve:
    description: "Self-improvement cycle"
    phases: [analyze, implement, test, commit]
    agents:
      analyze: skynet
      implement: skynet

  # === FULL MONTY ===
  everything:
    description: "The complete works"
    phases: [research, plan, implement, test, security, review, document, commit]
    
  production:
    description: "Production-grade feature"
    phases: [plan, implement, test, security, review, test, commit, deploy]

phases:
  plan: {description: "Strategic planning", timeout: 600}
  implement: {description: "Code writing", timeout: 1800}
  test: {description: "Testing & QA", timeout: 900}
  review: {description: "Code review", timeout: 300}
  debug: {description: "Bug hunting", timeout: 600}
  commit: {description: "Git operations", timeout: 180}
  security: {description: "Security analysis", timeout: 600}
  document: {description: "Documentation", timeout: 600}
  deploy: {description: "Deployment", timeout: 600}
  research: {description: "Research", timeout: 900}
  analyze: {description: "Analysis", timeout: 600}
  optimize: {description: "Optimization", timeout: 900}
